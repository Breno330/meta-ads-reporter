services:
  - type: web
    name: meta-ads-reporter
    runtime: node
    # Disco persistente e "sempre ligado" exigem plano pago (Starter+).
    # No plano free os dados em data/ sao apagados a cada sleep/deploy.
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    # IMPORTANTE: o disco precisa ficar ANINHADO dentro do servico (e como
    # objeto unico, nao lista). Se ficar no topo do arquivo, o Render ignora.
    # mountPath aponta exatamente para a pasta data/ que o app usa
    # (path.join(__dirname, 'data') -> /opt/render/project/src/data).
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: APP_BASE_URL
        sync: false
